<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }} | {{ site.affiliation }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="keywords" content="{{ site.keywords | escape }}">
    <link rel="canonical" href="{{ site.canonical }}">
    <link rel="icon" href="{{ '/assets/img/icon.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <details class="section-menu">
        <summary>Menu <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></summary>
        <nav aria-label="Sections">
          <a href="#about">About Me</a>
          <a href="#research-interests">Research Interests</a>
          <a href="#news">News</a>
          <a href="#publications">Publications</a>
          <a href="#patents">Patents</a>
          <a href="#teaching">Teaching</a>
          <a href="#professional-services">Professional Services</a>
          <a href="#invited-talks">Invited Talks</a>
          <a href="#awards">Awards</a>
        </nav>
      </details>
    </header>
    <main id="main" class="page" tabindex="-1">
      {{ content }}
    </main>
    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
